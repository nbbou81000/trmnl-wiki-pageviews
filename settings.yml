name: Top Wikipedia
strategy: polling
polling_url: "https://cdn.jsdelivr.net/gh/nbbou81000/trmnl-wiki-pageviews@main/docs/data/all.json"
polling_verb: get
refresh_frequency: 3600

custom_fields:
  - keyname: instance_bio
    name: About This Plugin
    field_type: author_bio
    description: Shows yesterday's most-viewed Wikipedia articles for a language edition of your choice.
    github_url: https://github.com/nbbou81000/trmnl-wiki-pageviews
    category: news

  - keyname: wiki_lang
    name: Language
    field_type: select
    default: en
    description: Which Wikipedia language edition to show
    options:
      - English: en
      - Français: fr
      - Deutsch: de
      - Español: es

  - keyname: display_mode
    name: Display Mode
    field_type: select
    default: image
    description: Thumbnail of the top article, or per-article trend stats
    options:
      - Thumbnail: image
      - Trends (no image): stats
